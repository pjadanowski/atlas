      summary: Export bookings
      description: Exports bookings as JSON or CSV depending on
        the `Accept` header.
      security:
      - oauth2:
        - bookings:read
        - reports:read
      parameters:
      - name: from
        in: query
        required: true
        schema:
          type: string
          format: date
        example: '2087-03-01'
      - name: to
        in: query
        required: true
        schema:
          type: string
          format: date
        example: '2087-03-31'
      responses:
        '200':
          description: The export.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Booking'
            text/csv:
              schema:
                type: string
              example: 'reference,flight,status,total

                ORB-7KQ2XD,OR412,confirmed,125000

                ORB-M4RS01,OR877,held,98000

                '
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        default:
          $ref: '#/components/responses/ServerError'
  /bookings/{bookingId}:
    parameters:
    - name: bookingId
      in: path
      required: true
      description: Booking UUID or reference (shared path-level
        parameter).
      schema:
        type: string
      examples:
        uuid:
          summary: By UUID
          value: 9a7c1d2e-3f40-4b5c-8d6e-7f8091a2b3c4
        reference:
          summary: By reference
          value: ORB-7KQ2XD
    get:
      tags:
      - Bookings
      operationId: getBooking
      summary: Get a booking
      security:
      - oauth2:
        - bookings:read
      - bearerAuth: []
      responses:
        '200':
          description: The booking.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Booking'
              examples:
                held:
                  $ref: '#/components/examples/HeldBooking'
                confirmed:
                  summary: A confirmed booking
                  value:
                    id: 9a7c1d2e-3f40-4b5c-8d6e-7f8091a2b3c4
                    reference: ORB-7KQ2XD
                    flight_id: b7a1e9c2-55aa-4c1e-8f00-0b1d2e3f4a5b
                    status: confirmed
                    passengers:
                    - passenger_id: 2d9f6a8e-1b3c-4e5f-8a7b-9c0d1e2f3a4b
                      seat: 14C
                      cabin_class: economy
                    add_ons: []
                    total:
                      amount: 125000
                      currency: CRD
                    notes: null
                    hold_expires_at: null
                    created_at: '2087-03-01T10:00:00Z'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        default:
          $ref: '#/components/responses/ServerError'
    patch:
      tags:
      - Bookings
      operationId: updateBooking
      summary: Update a booking
      description: Change add-ons or notes. Seat changes go through
        `POST /bookings/{bookingId}/seat-change` (coming soon).
      security:
      - oauth2:
        - bookings:write
      parameters:
      - name: If-Match
        in: header
        required: true
        description: ETag from `getBooking` — prevents lost updates.
        schema:
          type: string
        example: W/"a1b2c3"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BookingPatch'
            examples:
              addBaggage:
                summary: Add extra baggage
                value:
                  add_ons:
                  - priority_boarding
                  - extra_baggage
              clearNotes:
                summary: Clear the notes
                value:
                  notes: null
      responses:
        '200':
          description: Updated booking.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Booking'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: The booking changed since you read it (ETag
            mismatch).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        default:
          $ref: '#/components/responses/ServerError'
    delete:
      tags:
      - Bookings
      operationId: cancelBooking
      summary: Cancel a booking
      description: Cancels the booking. Paid bookings are refunded
        according to the fare rules.
      security:
      - oauth2:
        - bookings:write
      - bearerAuth: []
      parameters:
      - name: reason
        in: query
        schema:
          type: string
          enum:
          - changed_plans
          - medical
          - duplicate
          - other
          default: changed_plans
      responses:
        '204':
          description: Cancelled. No content.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Already departed — cannot cancel.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        default:
          $ref: '#/components/responses/ServerError'
