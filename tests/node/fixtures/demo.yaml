# Generated from examples/demo/openapi.json; regenerate after changing the demo:
#   python3 -c "import json,yaml; print(yaml.safe_dump(json.load(open('examples/demo/openapi.json')), sort_keys=False, allow_unicode=True, width=60), end='')"
openapi: 3.1.0
info:
  title: Orbit Travel API
  version: 2.4.0
  summary: Book seats on scheduled shuttles between orbital stations,
    moons and planetary spaceports.
  description: 'The **Orbit Travel API** powers every booking
    surface of the (entirely fictional) Orbit Travel network —
    from the kiosk at *Lunar Gateway* to partner travel agencies
    on three planets.


    It lets you search scheduled shuttle flights between stations,
    hold and confirm bookings, manage passenger profiles and travel
    documents, take payments and run the **Orbit Miles** loyalty
    programme.


    ### Getting started


    1. Request sandbox credentials from the [partner portal](https://partners.orbit.example/signup).

    2. Exchange your client credentials for an access token via
    `POST /oauth/token`.

    3. Send the token as `Authorization: Bearer <token>` on every
    request.

    4. Point your integration at `https://sandbox.orbit.example/v2`
    until you pass certification.


    All request and response bodies are JSON encoded as UTF-8.
    Timestamps are ISO 8601 in **UTC** (`2087-03-14T09:30:00Z`),
    money amounts are integers in the *minor unit* of the currency
    (`12500` = 125.00 CRD).


    ### Rate limits


    Every response carries `X-RateLimit-Limit` and `X-RateLimit-Remaining`
    headers.


    | Plan | Requests per minute |

    | --- | --- |

    | Sandbox | 60 |

    | Partner | 600 |

    | Enterprise | 6000 |


    When you exceed the limit the API answers with `429 Too Many
    Requests` and a `Retry-After` header — back off and retry.


    ### Errors


    Errors follow [RFC 9457 problem details](https://www.rfc-editor.org/rfc/rfc9457):


    - `400` — the request is malformed (bad JSON, wrong types)

    - `401` / `403` — missing credentials or missing scope

    - `404` — the resource does not exist **or** you cannot see
    it

    - `409` — a conflict, e.g. the seat was just taken by someone
    else

    - `422` — validation failed; see the `errors` map for field-level
    messages


    > Tip: every error contains a `trace_id`. Include it when
    you contact [support](mailto:devs@orbit.example).'
  termsOfService: https://orbit.example/legal/api-terms
  contact:
    name: Orbit Developer Relations
    url: https://developers.orbit.example
    email: devs@orbit.example
  license:
    name: MIT
    identifier: MIT
jsonSchemaDialect: https://spec.openapis.org/oas/3.1/dialect/base
servers:
- url: https://api.orbit.example/v2
  description: Production
- url: https://sandbox.orbit.example/v2
  description: Sandbox — no real credits are charged
- url: https://{region}.api.orbit.example/{basePath}
  description: Regional edge cluster (lower latency near your
    station)
  variables:
    region:
      enum:
      - luna
      - mars
      - europa
      - ceres
      default: luna
      description: Edge region closest to your users
    basePath:
      default: v2
      description: API version prefix
security:
- bearerAuth: []
tags:
- name: Stations
  description: Spaceports, orbital stations and moon bases served
    by the network. Stations can be nested — a **dock** belongs
    to a **station**, which may belong to a **hub**.
- name: Flights
  description: Scheduled shuttle flights, seat maps and fare history.
    Flight data is public but rate limited.
- name: Bookings
  description: Create, change and cancel bookings. A booking holds
    one or more seats for up to **15 minutes** until it is paid.
  externalDocs:
    description: Booking lifecycle guide
    url: https://developers.orbit.example/guides/booking-lifecycle
- name: Passengers
  x-displayName: Passengers & Documents
  description: Passenger profiles and the travel documents (radiation
    clearance, planetary visas) attached to them.
- name: Payments
  description: Charge bookings using cards, bank transfers or
    crypto-free stellar wallets, and issue refunds.
- name: Loyalty
  x-displayName: Orbit Miles
  description: 'The **Orbit Miles** loyalty programme: balances,
    tiers and redemptions.'
- name: Auth
  x-displayName: Authentication
  description: Obtain access tokens and inspect the current principal.
- name: Reports
  description: Operational reports and platform status for partners.
x-tagGroups:
- name: Booking
  tags:
  - Stations
  - Flights
  - Bookings
  - Payments
- name: Account
  tags:
  - Passengers
  - Loyalty
- name: Platform
  tags:
  - Auth
  - Reports
externalDocs:
  description: Developer guides
  url: https://developers.orbit.example/guides
paths:
  /oauth/token:
    post:
      tags:
      - Auth
      operationId: createAccessToken
      summary: Obtain an access token
      description: Exchange client credentials (or a refresh token)
        for a short-lived JWT access token. Accepts both **JSON**
        and classic **form-encoded** bodies, as per RFC 6749.
      security: []
      x-keywords:
      - login
      - authenticate
      - jwt
      - oauth
      - sign in
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRequest'
            example:
              grant_type: client_credentials
              client_id: partner_42
              client_secret: s3cr3t-0rb1t
              scope: bookings:read bookings:write
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenRequest'
            example:
              grant_type: client_credentials
              client_id: partner_42
              client_secret: s3cr3t-0rb1t
      responses:
        '200':
          description: Token issued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /me:
    get:
      tags:
      - Auth
      operationId: getCurrentPrincipal
      summary: Get the current principal
      description: Returns who you are authenticated as. Works
        with a bearer token **or** the web portal session cookie.
      security:
      - bearerAuth: []
      - sessionCookie: []
      parameters:
      - name: orbit_locale
        in: cookie
        description: Preferred locale stored by the portal.
        schema:
          type: string
          enum:
          - en
          - de
          - fr
          - ja
          - pt-BR
          default: en
      responses:
        '200':
          description: The current principal.
          headers:
            X-RateLimit-Limit:
              $ref: '#/components/headers/X-RateLimit-Limit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/X-RateLimit-Remaining'
          content:
            application/json:
              schema:
                type: object
                properties:
                  kind:
                    type: string
                    enum:
                    - partner
                    - passenger
                    example: partner
                  id:
                    type: string
                    example: partner_42
                  scopes:
                    type: array
                    items:
                      type: string
                    example:
                    - bookings:read
                    - bookings:write
                  passenger:
                    anyOf:
                    - $ref: '#/components/schemas/Passenger'
                    - type: 'null'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        default:
          $ref: '#/components/responses/ServerError'
  /stations:
    get:
      tags:
      - Stations
      operationId: listStations
      summary: List stations
      description: Lists all stations served by the network. Public
        — no authentication required.
      security: []
      x-keywords:
      - spaceport
      - airport
      - dock
      - hub
      - destinations
      parameters:
      - $ref: '#/components/parameters/page'
      - $ref: '#/components/parameters/per_page'
      - name: body
        in: query
        description: 'Filter by one or more celestial bodies.
          Repeat the parameter: `?body=moon&body=mars`.'
        style: form
        explode: true
        schema:
          type: array
          items:
            type: string
            enum:
            - earth
            - moon
            - mars
            - europa
            - ceres
            - titan
          uniqueItems: true
        example:
        - moon
        - mars
      - name: kind
        in: query
        schema:
          type: string
          enum:
          - hub
          - station
          - dock
          - surface_port
      - name: q
        in: query
        description: Free-text search over name and code.
        schema:
          type: string
          minLength: 2
        examples:
          byName:
            summary: Search by name
            value: gateway
          byCode:
            summary: Search by code
            value: LGW
      - name: include_docks
        in: query
        deprecated: true
        description: Deprecated — use `kind=dock` instead.
        schema:
          type: boolean
          default: false
      responses:
        '200':
          description: A page of stations.
          headers:
            X-RateLimit-Limit:
              $ref: '#/components/headers/X-RateLimit-Limit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/X-RateLimit-Remaining'
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                - meta
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Station'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'
                  links:
                    $ref: '#/components/schemas/PaginationLinks'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        default:
          $ref: '#/components/responses/ServerError'
  /stations/{stationCode}:
    parameters:
    - name: stationCode
      in: path
      required: true
      description: Station code (shared by all operations on this
        path).
      schema:
        type: string
        pattern: ^[A-Z]{3,5}(-[0-9A-Z]{1,4})?$
      example: LGW-1
    get:
      tags:
      - Stations
      operationId: getStation
      summary: Get a station
      description: Returns a single station including its `parent_station`
        chain.
      security: []
      responses:
        '200':
          description: The station.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Station'
              example:
                id: 6c4f2b1e-8a0d-4d2b-9a3e-1f2c3d4e5f60
                code: LGW-1
                name: Lunar Gateway — Dock 1
                kind: dock
                body: moon
                timezone: UTC
                gravity_g: 0
                position:
                  x: 1.0026
                  y: -0.0019
                  z: 2.0e-05
                amenities:
                - lounge
                parent_station:
                  id: 1a2b3c4d-5e6f-4a7b-8c9d-0e1f2a3b4c5d
                  code: LGW
                  name: Lunar Gateway
                  kind: hub
                  body: moon
                  parent_station: null
                created_at: '2081-06-01T00:00:00Z'
        '404':
          $ref: '#/components/responses/NotFound'
  /stations/{stationCode}/departures:
    parameters:
    - name: stationCode
      in: path
      required: true
      schema:
        type: string
      example: LGW
    get:
      tags:
      - Stations
      operationId: listStationDepartures
      summary: List departures from a station
      description: '**Deprecated.** Use `GET /flights/search?origin={code}`
        instead. This endpoint will be removed on 2088-01-01.'
      deprecated: true
      security: []
      parameters:
      - name: date
        in: query
        schema:
          type: string
          format: date
        example: '2087-03-14'
      responses:
        '200':
          description: Departures.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Flight'
        '404':
          $ref: '#/components/responses/NotFound'
  /flights/search:
    get:
      tags:
      - Flights
      operationId: searchFlights
      summary: Search flights
      description: 'Find bookable flights between two stations.


        - Results are sorted by `departs_at` unless `sort` is
        given.

        - Use `cabin_class` repeatedly to search several cabins.

        - Fares are quoted in `currency`.'
      x-keywords:
      - find
      - availability
      - schedule
      - timetable
      - shuttle
      parameters:
      - name: origin
        in: query
        required: true
        description: Origin station code.
        schema:
          type: string
          pattern: ^[A-Z]{3,5}(-[0-9A-Z]{1,4})?$
        example: LGW
      - name: destination
        in: query
        required: true
        description: Destination station code.
        schema:
          type: string
        examples:
          mars:
            summary: Mars Olympus Port
            value: OLYM
          europa:
            summary: Europa Deep Station
            value: EUR-D4
      - name: date
        in: query
        required: true
        schema:
          type: string
          format: date
        example: '2087-03-14'
      - name: passengers
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 9
          default: 1
      - name: cabin_class
        in: query
        style: form
        explode: true
        schema:
          type: array
          items:
            $ref: '#/components/schemas/CabinClass'
          minItems: 1
        example:
        - economy
        - premium
      - name: max_price
        in: query
        description: Upper bound in major units.
        schema:
          type: number
          format: double
          exclusiveMinimum: 0
        example: 2500
      - name: currency
        in: query
        schema:
          type: string
          enum:
          - CRD
          - EUR
          - USD
          - MRS
          default: CRD
      - name: sort
        in: query
        schema:
          type: string
          enum:
          - departs_at
          - -departs_at
          - price
          - duration
          default: departs_at
      - name: Accept-Language
        in: header
        schema:
          type: string
          default: en
        example: en-GB
      - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: Matching flights.
          headers:
            X-RateLimit-Limit:
              $ref: '#/components/headers/X-RateLimit-Limit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/X-RateLimit-Remaining'
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Flight'
                  searched_at:
                    type: string
                    format: date-time
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        default:
          $ref: '#/components/responses/ServerError'
  /flights/{flightId}:
    get:
      tags:
      - Flights
      operationId: getFlight
      summary: Get a flight
      description: 'Supports conditional requests: send the `ETag`
        you got earlier as `If-None-Match` to receive `304 Not
        Modified`.'
      parameters:
      - $ref: '#/components/parameters/FlightId'
      - name: If-None-Match
        in: header
        schema:
          type: string
        example: W/"a1b2c3"
      responses:
        '200':
          description: The flight.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            X-RateLimit-Limit:
              $ref: '#/components/headers/X-RateLimit-Limit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/X-RateLimit-Remaining'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Flight'
        '304':
          description: Not modified.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        default:
          $ref: '#/components/responses/ServerError'
  /flights/{flightId}/seats:
    get:
      tags:
      - Flights
      operationId: getFlightSeatMap
      summary: Get the seat map
      parameters:
      - $ref: '#/components/parameters/FlightId'
      - name: cabin_class
        in: query
        schema:
          $ref: '#/components/schemas/CabinClass'
      responses:
        '200':
          description: Seat map grouped by deck.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SeatMap'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        default:
          $ref: '#/components/responses/ServerError'
  /flights/{flightId}/fare-history:
    get:
      tags:
      - Flights
      operationId: getFlightFareHistory
      summary: Get fare history
      description: Lowest fare per day for the last `days` days.
      parameters:
      - $ref: '#/components/parameters/FlightId'
      - name: days
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 90
          default: 30
      responses:
        '200':
          description: Fare history.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FareHistory'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        default:
          $ref: '#/components/responses/ServerError'
  /bookings:
    get:
      tags:
      - Bookings
      operationId: listBookings
      summary: List bookings
      security:
      - oauth2:
        - bookings:read
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/page'
      - $ref: '#/components/parameters/per_page'
      - name: status
        in: query
        style: form
        explode: true
        schema:
          type: array
          items:
            type: string
            enum:
            - held
            - confirmed
            - checked_in
            - cancelled
            - expired
        example:
        - held
        - confirmed
      - name: created_after
        in: query
        schema:
          type: string
          format: date-time
      responses:
        '200':
          description: A page of bookings.
          headers:
            X-RateLimit-Limit:
              $ref: '#/components/headers/X-RateLimit-Limit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/X-RateLimit-Remaining'
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                - meta
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Booking'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'
                  links:
                    $ref: '#/components/schemas/PaginationLinks'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        default:
          $ref: '#/components/responses/ServerError'
    post:
      tags:
      - Bookings
      operationId: createBooking
      summary: Create a booking
      description: 'Holds the requested seats for **15 minutes**.
        Pay within that window via `POST /payments` or the hold
        expires.


        If you pass `callback_url`, we `POST` the final status
        of the booking to it once it is confirmed or expires.'
      security:
      - oauth2:
        - bookings:write
      - bearerAuth: []
      x-keywords:
      - reserve
      - hold
      - book
      - ticket
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        description: The flight and passengers to book.
        content:
          application/json:
            schema:
              allOf:
              - $ref: '#/components/schemas/Booking'
              - type: object
                properties:
                  callback_url:
                    type:
                    - string
                    - 'null'
                    format: uri
                    description: Where to send the status callback.
                    example: https://agency.example/hooks/orbit
            examples:
              single:
                summary: One passenger, explicit seat
                description: 'The simplest booking: one passenger
                  with a concrete seat code.'
                value:
                  flight_id: b7a1e9c2-55aa-4c1e-8f00-0b1d2e3f4a5b
                  passengers:
                  - passenger_id: 2d9f6a8e-1b3c-4e5f-8a7b-9c0d1e2f3a4b
                    seat: 14C
              family:
                summary: Family with seat preferences
                value:
                  flight_id: b7a1e9c2-55aa-4c1e-8f00-0b1d2e3f4a5b
                  passengers:
                  - passenger_id: 2d9f6a8e-1b3c-4e5f-8a7b-9c0d1e2f3a4b
                    seat:
                      window: true
                    cabin_class: premium
                  - passenger_id: 7e8f9a0b-1c2d-4e3f-a4b5-c6d7e8f9a0b1
                    seat:
                      window: false
                      near_exit: true
                    cabin_class: premium
                  add_ons:
                  - extra_baggage
                  - travel_insurance
                  notes: Child travelling, needs booster harness.
              suite:
                summary: Zero-G suite with EVA walk
                value:
                  flight_id: b7a1e9c2-55aa-4c1e-8f00-0b1d2e3f4a5b
                  passengers:
                  - passenger_id: 2d9f6a8e-1b3c-4e5f-8a7b-9c0d1e2f3a4b
                    cabin_class: zero_g_suite
                  add_ons:
                  - eva_walk
                  - viewport_upgrade
      callbacks:
        bookingStatus:
          '{$request.body#/callback_url}':
            post:
              summary: Booking status callback
              description: Sent once when the booking is confirmed
                or the hold expires.
              requestBody:
                required: true
                content:
                  application/json:
                    schema:
                      type: object
                      required:
                      - booking_id
                      - status
                      properties:
                        booking_id:
                          type: string
                          format: uuid
                        status:
                          type: string
                          enum:
                          - confirmed
                          - expired
                        occurred_at:
                          type: string
                          format: date-time
              responses:
                '204':
                  description: Callback received. Any 2xx acknowledges
                    it.
      x-codeSamples:
      - lang: Shell
        label: cURL
        source: "curl -X POST https://api.orbit.example/v2/bookings\
          \ \\\n  -H \"Authorization: Bearer $ORBIT_TOKEN\" \\\
          \n  -H \"Idempotency-Key: $(uuidgen)\" \\\n  -H \"Content-Type:\
          \ application/json\" \\\n  -d '{\"flight_id\":\"b7a1e9c2-55aa-4c1e-8f00-0b1d2e3f4a5b\"\
          ,\"passengers\":[{\"passenger_id\":\"2d9f6a8e-1b3c-4e5f-8a7b-9c0d1e2f3a4b\"\
          ,\"seat\":\"14C\"}]}'"
      - lang: PHP
        label: PHP (Guzzle)
        source: "<?php\n$client = new \\GuzzleHttp\\Client(['base_uri'\
          \ => 'https://api.orbit.example/v2/']);\n$response =\
          \ $client->post('bookings', [\n    'headers' => [\n\
          \        'Authorization'   => 'Bearer ' . getenv('ORBIT_TOKEN'),\n\
          \        'Idempotency-Key' => bin2hex(random_bytes(16)),\n\
          \    ],\n    'json' => [\n        'flight_id'  => 'b7a1e9c2-55aa-4c1e-8f00-0b1d2e3f4a5b',\n\
          \        'passengers' => [['passenger_id' => '2d9f6a8e-1b3c-4e5f-8a7b-9c0d1e2f3a4b',\
          \ 'seat' => '14C']],\n    ],\n]);\n$booking = json_decode((string)\
          \ $response->getBody(), true);"
      responses:
        '201':
          description: Booking held.
          headers:
            Location:
              $ref: '#/components/headers/Location'
            X-RateLimit-Limit:
              $ref: '#/components/headers/X-RateLimit-Limit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/X-RateLimit-Remaining'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Booking'
              examples:
                held:
                  $ref: '#/components/examples/HeldBooking'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: One of the requested seats was taken in
